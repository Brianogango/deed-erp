<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deed ERP — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090B12;
      color: #CBD5E1;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #121521;
      border: 1px solid #1E2435;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #F1F5F9; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #94A3B8; line-height: 1.6; margin-bottom: 16px; }
    .badge {
      display: inline-block;
      background: #1B2762;
      color: #38BDF8;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 24px;
    }
    button {
      background: #1B2762;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
    }
    button:hover:not(:disabled) { background: #243380; }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .status {
      min-height: 18px;
      margin: 0 0 16px;
      font-size: 12px;
      color: #F87171;
    }
    .status.ok { color: #4ADE80; }
    .pos-note {
      margin-top: 20px;
      padding: 12px 16px;
      background: #0F1A40;
      border: 1px solid #1B2762;
      border-radius: 8px;
      font-size: 12px;
      color: #7DD3FC;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <span class="badge">No Connection</span>
    <h1>You're offline</h1>
    <p>Deed ERP requires a connection for most features. Point of Sale will continue working with previously cached data.</p>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button type="button" id="retry">Try Again</button>
    <div class="pos-note">
      💡 POS sales made offline will sync automatically when you reconnect.
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('retry')
      var statusEl = document.getElementById('status')
      var checking = false

      function returnUrl() {
        try {
          var stored = sessionStorage.getItem('deed_offline_return')
          if (stored && stored !== '/offline.html' && stored.indexOf('/offline.html') !== 0) {
            return stored
          }
        } catch (e) { /* private mode */ }
        // If SW served this fallback for another route, location is still that route.
        if (location.pathname && location.pathname !== '/offline.html') {
          return location.pathname + location.search + location.hash
        }
        return '/'
      }

      function rememberReturn() {
        try {
          if (location.pathname !== '/offline.html') {
            sessionStorage.setItem(
              'deed_offline_return',
              location.pathname + location.search + location.hash
            )
          }
        } catch (e) { /* ignore */ }
      }

      async function probeOnline() {
        // navigator.onLine alone is unreliable; probe a tiny same-origin asset
        // that the SW does not treat as navigational HTML.
        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null
        var timer = setTimeout(function () {
          if (controller) controller.abort()
        }, 4000)
        try {
          var res = await fetch('/manifest.json?__online_check=' + Date.now(), {
            method: 'GET',
            cache: 'no-store',
            credentials: 'same-origin',
            signal: controller ? controller.signal : undefined,
            headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' },
          })
          return res.ok
        } catch (e) {
          return false
        } finally {
          clearTimeout(timer)
        }
      }

      function goOnline() {
        statusEl.className = 'status ok'
        statusEl.textContent = 'Connection restored — reloading…'
        var target = returnUrl()
        try { sessionStorage.removeItem('deed_offline_return') } catch (e) { /* ignore */ }
        // Always navigate (not bare reload) so we leave /offline.html when that
        // is the document URL, and pick up fresh HTML for the intended route.
        location.replace(target)
      }

      async function tryAgain() {
        if (checking) return
        checking = true
        btn.disabled = true
        btn.textContent = 'Checking…'
        statusEl.className = 'status'
        statusEl.textContent = ''

        var online = await probeOnline()
        if (online) {
          goOnline()
          return
        }

        checking = false
        btn.disabled = false
        btn.textContent = 'Try Again'
        statusEl.className = 'status'
        statusEl.textContent = 'Still offline — check your network and try again.'
      }

      rememberReturn()
      btn.addEventListener('click', function (e) {
        e.preventDefault()
        tryAgain()
      })

      // Auto-retry when the browser reports connectivity again.
      window.addEventListener('online', function () {
        tryAgain()
      })
    })()
  </script>
</body>
</html>
