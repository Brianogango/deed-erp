<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deed ERP — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090B12;
      color: #CBD5E1;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #121521;
      border: 1px solid #1E2435;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #F1F5F9; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #94A3B8; line-height: 1.6; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #1B2762;
      color: #38BDF8;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 24px;
    }
    button {
      background: #1B2762;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #243380; }
    .pos-note {
      margin-top: 20px;
      padding: 12px 16px;
      background: #0F1A40;
      border: 1px solid #1B2762;
      border-radius: 8px;
      font-size: 12px;
      color: #7DD3FC;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <span class="badge">No Connection</span>
    <h1>You're offline</h1>
    <p>Deed ERP requires a connection for most features. Point of Sale will continue working with previously cached data.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="pos-note">
      💡 POS sales made offline will sync automatically when you reconnect.
    </div>
  </div>
</body>
</html>
