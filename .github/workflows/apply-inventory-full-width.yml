name: Apply inventory full width
on:
  push:
    branches:
      - fix/inventory-active-location-full-width
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventory-active-location-full-width
          fetch-depth: 0
      - name: Patch active inventory location width
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('components/modules/Inventory.tsx')
          s = p.read_text()
          old = 'className="inventory-warehouse-board inventory-warehouse-board--single"'
          count = s.count(old)
          if count != 3:
            raise SystemExit(f'expected 3 active location wrappers, found {count}')
          s = s.replace(old, 'className="w-full min-w-0"')
          outer = '<div className="rounded-token-md border border-[var(--border-lt)] bg-[var(--bg-card)] overflow-hidden">\n              <div className="flex flex-wrap gap-2 border-b'
          outer_new = '<div className="w-full min-w-0 rounded-token-md border border-[var(--border-lt)] bg-[var(--bg-card)] overflow-hidden">\n              <div className="flex flex-wrap gap-2 border-b'
          if outer not in s:
            raise SystemExit('location shell anchor not found')
          s = s.replace(outer, outer_new, 1)
          row = '<div className="inventory-warehouse-row">'
          if row not in s:
            raise SystemExit('warehouse row anchor not found')
          s = s.replace(row, '<div className="inventory-warehouse-row w-full min-w-0 text-left">', 1)
          meta = '<div className="inventory-warehouse-row__meta min-w-0">'
          if meta not in s:
            raise SystemExit('warehouse row meta anchor not found')
          s = s.replace(meta, '<div className="inventory-warehouse-row__meta min-w-0 flex-1 text-left">', 1)
          p.write_text(s)
          Path('.github/workflows/apply-inventory-full-width.yml').unlink(missing_ok=True)
          PY
      - name: Validate patch
        run: |
          git diff --check
          test "$(grep -c 'className="w-full min-w-0"' components/modules/Inventory.tsx)" -ge 3
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/Inventory.tsx .github/workflows
          git commit -m "Make active warehouse location full width"
          git push origin HEAD:fix/inventory-active-location-full-width
