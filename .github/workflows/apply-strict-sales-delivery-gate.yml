name: Apply strict Sales delivery gate

on:
  push:
    branches:
      - fix/strict-sales-delivery-before-invoice

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-sales-delivery-before-invoice
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_strict_sales_delivery_gate.py
      - name: Commit patch
        run: |
          rm -f scripts/apply_strict_sales_delivery_gate.py .github/workflows/apply-strict-sales-delivery-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce validated delivery before Sales invoice"
          git push origin HEAD:fix/strict-sales-delivery-before-invoice
