name: Ops delete repairs (push trigger)

on:
  push:
    branches: [master]
    paths:
      - 'ops/delete-repairs-request.json'

jobs:
  delete-repairs:
    name: Delete repairs on Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request
        id: req
        run: |
          set -euo pipefail
          COUNT=$(jq -r '.refs // [] | length' ops/delete-repairs-request.json)
          APPLY=$(jq -r '.apply // false' ops/delete-repairs-request.json)
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: refs[] required in ops/delete-repairs-request.json" >&2
            exit 1
          fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "Refs to process:"
          jq -r '.refs[]' ops/delete-repairs-request.json

      - name: Copy script + request to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/delete-repairs.mjs,ops/delete-repairs-request.json
          target: /tmp/deed-ops/

      - name: Run delete-repairs script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            SCRIPT=scripts/delete-repairs.mjs
            REQUEST=ops/delete-repairs-request.json
            mkdir -p scripts ops
            cp /tmp/deed-ops/scripts/delete-repairs.mjs "$SCRIPT"
            cp /tmp/deed-ops/ops/delete-repairs-request.json "$REQUEST"
            echo "apply=${{ steps.req.outputs.apply }}"
            node "$SCRIPT" --request "$REQUEST"
            if git ls-files --error-unmatch "$SCRIPT" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$SCRIPT" 2>/dev/null || git checkout HEAD -- "$SCRIPT" || true
            else
              rm -f "$SCRIPT"
            fi
            if git ls-files --error-unmatch "$REQUEST" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$REQUEST" 2>/dev/null || git checkout HEAD -- "$REQUEST" || true
            else
              rm -f "$REQUEST"
            fi
