name: Apply repair requote revision fix
on:
  push:
    branches:
      - fix/repair-requote-renotify-salesperson-copy
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-requote-renotify-salesperson-copy
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-repair-requote-fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix repair quote revisions and client re-notification"
          git push origin HEAD:fix/repair-requote-renotify-salesperson-copy
