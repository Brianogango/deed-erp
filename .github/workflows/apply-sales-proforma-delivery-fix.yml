name: Apply Sales proforma and invoice gate fix

on:
  push:
    branches:
      - fix/sales-proforma-delivery-invoice-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sales-proforma-delivery-invoice-gate
          fetch-depth: 0

      - name: Apply exact Sales.tsx replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/modules/Sales.tsx')
          text = path.read_text()

          old = """                              { label: 'Pro-forma preview', icon: faFileInvoiceDollar, disabled: !activeOrder.lines.length, onClick: () => setShowProformaPreview(true) },"""
          new = """                              { label: 'Download pro-forma', icon: faDownload, disabled: !activeOrder.lines.length, onClick: () => void downloadProformaInvoice(activeOrder) },"""
          if old not in text:
              raise SystemExit('Pro-forma menu target not found')
          text = text.replace(old, new, 1)

          old = """                            ...(canInvoiceFromSO && canCreateInvoiceNow ? [{ label: 'Create Partial Invoice…', icon: faFileInvoiceDollar, onClick: () => openPartialInvoiceModal(activeOrder) }] : []),"""
          new = """                            ...(canInvoiceFromSO && !canCreateInvoiceNow ? [{
                              label: 'Create down payment…',
                              icon: faMoneyBillWave,
                              onClick: () => {
                                setInvoiceWizardMode('down_payment_percent')
                                setInvoiceWizardPercent('30')
                                setInvoiceWizardAmount('')
                                setShowInvoiceWizard(true)
                              },
                            }] : []),
                            ...(canInvoiceFromSO && canCreateInvoiceNow ? [{ label: 'Create Partial Invoice…', icon: faFileInvoiceDollar, onClick: () => openPartialInvoiceModal(activeOrder) }] : []),"""
          if old not in text:
              raise SystemExit('SO More invoice target not found')
          text = text.replace(old, new, 1)

          old = """                          ) : (
                            <button
                              type=\"button\"
                              className=\"sp-btn sp-btn-primary sales-action-primary\"
                              onClick={() => {
                                setInvoiceWizardMode(canCreateInvoiceNow ? 'regular' : 'down_payment_percent')
                                setInvoiceWizardPercent('30')
                                setInvoiceWizardAmount('')
                                setShowInvoiceWizard(true)
                              }}
                            >
                              Create invoice
                            </button>
                          )
                        ) : (
                          <button type=\"button\" className=\"sp-btn sp-btn-primary sales-action-primary\" onClick={() => void openDeliveryView()}>
                            {visibleDeliveries.length === 0 ? 'Create delivery' : 'Delivery'}
                          </button>
                        )}"""
          new = """                          ) : canCreateInvoiceNow ? (
                            <button
                              type=\"button\"
                              className=\"sp-btn sp-btn-primary sales-action-primary\"
                              onClick={() => {
                                setInvoiceWizardMode('regular')
                                setInvoiceWizardPercent('30')
                                setInvoiceWizardAmount('')
                                setShowInvoiceWizard(true)
                              }}
                            >
                              Create invoice
                            </button>
                          ) : (
                            <button type=\"button\" className=\"sp-btn sp-btn-primary sales-action-primary\" onClick={() => void openDeliveryView()}>
                              {visibleDeliveries.length === 0 ? 'Create delivery' : 'Complete delivery'}
                            </button>
                          )
                        ) : (
                          <button type=\"button\" className=\"sp-btn sp-btn-primary sales-action-primary\" onClick={() => void openDeliveryView()}>
                            {visibleDeliveries.length === 0 ? 'Create delivery' : 'Delivery'}
                          </button>
                        )}"""
          if old not in text:
              raise SystemExit('Primary invoice action target not found')
          text = text.replace(old, new, 1)

          old = """                                      <button
                                        type=\"button\"
                                        className=\"sp-btn sp-btn-primary\"
                                        onClick={() => {
                                          setInvoiceWizardMode(canCreateInvoiceNow ? 'regular' : 'down_payment_percent')
                                          setShowInvoiceWizard(true)
                                        }}
                                      >
                                        Create invoice…
                                      </button>"""
          new = """                                      <button
                                        type=\"button\"
                                        className=\"sp-btn sp-btn-primary\"
                                        onClick={() => {
                                          setInvoiceWizardMode(canCreateInvoiceNow ? 'regular' : 'down_payment_percent')
                                          setInvoiceWizardPercent('30')
                                          setInvoiceWizardAmount('')
                                          setShowInvoiceWizard(true)
                                        }}
                                      >
                                        {canCreateInvoiceNow ? 'Create invoice…' : 'Create down payment…'}
                                      </button>"""
          if old not in text:
              raise SystemExit('Invoices tab CTA target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          # One-shot workflow: remove itself from the resulting code commit.
          Path('.github/workflows/apply-sales-proforma-delivery-fix.yml').unlink()

      - name: Commit targeted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/Sales.tsx .github/workflows/apply-sales-proforma-delivery-fix.yml
          git diff --cached --check
          git commit -m "Fix proforma download and delivery-first invoice CTA"
          git push origin HEAD:fix/sales-proforma-delivery-invoice-gate
