name: Apply Sales proforma and invoice gate fix

on:
  push:
    branches:
      - fix/sales-proforma-delivery-invoice-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sales-proforma-delivery-invoice-gate
          fetch-depth: 0

      - name: Apply Sales.tsx replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/modules/Sales.tsx')
          text = path.read_text()

          replacements = [
            (
              "{ label: 'Pro-forma preview', icon: faFileInvoiceDollar, disabled: !activeOrder.lines.length, onClick: () => setShowProformaPreview(true) },",
              "{ label: 'Download pro-forma', icon: faDownload, disabled: !activeOrder.lines.length, onClick: () => void downloadProformaInvoice(activeOrder) },",
              'Pro-forma menu',
            ),
            (
              "...(canInvoiceFromSO && canCreateInvoiceNow ? [{ label: 'Create Partial Invoice…', icon: faFileInvoiceDollar, onClick: () => openPartialInvoiceModal(activeOrder) }] : []),",
              """...(canInvoiceFromSO && !canCreateInvoiceNow ? [{
                              label: 'Create down payment…',
                              icon: faMoneyBillWave,
                              onClick: () => {
                                setInvoiceWizardMode('down_payment_percent')
                                setInvoiceWizardPercent('30')
                                setInvoiceWizardAmount('')
                                setShowInvoiceWizard(true)
                              },
                            }] : []),
                            ...(canInvoiceFromSO && canCreateInvoiceNow ? [{ label: 'Create Partial Invoice…', icon: faFileInvoiceDollar, onClick: () => openPartialInvoiceModal(activeOrder) }] : []),""",
              'SO secondary invoice actions',
            ),
            (
              """onClick={() => {
                                setInvoiceWizardMode(canCreateInvoiceNow ? 'regular' : 'down_payment_percent')
                                setInvoiceWizardPercent('30')
                                setInvoiceWizardAmount('')
                                setShowInvoiceWizard(true)
                              }}
                            >
                              Create invoice""",
              """onClick={() => {
                                if (!canCreateInvoiceNow) {
                                  void openDeliveryView()
                                  return
                                }
                                setInvoiceWizardMode('regular')
                                setInvoiceWizardPercent('30')
                                setInvoiceWizardAmount('')
                                setShowInvoiceWizard(true)
                              }}
                            >
                              {canCreateInvoiceNow
                                ? 'Create invoice'
                                : visibleDeliveries.length === 0 ? 'Create delivery' : 'Complete delivery'}""",
              'SO primary action',
            ),
            (
              """onClick={() => {
                                          setInvoiceWizardMode(canCreateInvoiceNow ? 'regular' : 'down_payment_percent')
                                          setShowInvoiceWizard(true)
                                        }}
                                      >
                                        Create invoice…""",
              """onClick={() => {
                                          setInvoiceWizardMode(canCreateInvoiceNow ? 'regular' : 'down_payment_percent')
                                          setInvoiceWizardPercent('30')
                                          setInvoiceWizardAmount('')
                                          setShowInvoiceWizard(true)
                                        }}
                                      >
                                        {canCreateInvoiceNow ? 'Create invoice…' : 'Create down payment…'}""",
              'Invoices tab CTA',
            ),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} target not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/apply-sales-proforma-delivery-fix.yml').unlink()

      - name: Commit targeted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/Sales.tsx .github/workflows/apply-sales-proforma-delivery-fix.yml
          git diff --cached --check
          git commit -m "Fix proforma download and delivery-first invoice CTA"
          git push origin HEAD:fix/sales-proforma-delivery-invoice-gate
