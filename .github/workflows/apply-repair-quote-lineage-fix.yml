name: Apply repair quote lineage fix
on:
  push:
    branches:
      - fix/repair-quote-state-and-so-invoice-lineage
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_repair_quote_lineage_fix.py
      - name: Validate
        run: |
          git diff --check
          grep -q "repairsRef.current = repairsRef.current.map(r => r.id === repairId ? savedRepair : r)" lib/store.tsx
          grep -q "Repair Sales Order is missing" lib/store.tsx
          grep -q "repairFulfillmentReady" 'app/api/sale-orders/[id]/create-invoice/route.ts'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep repair quote and invoice lineage aligned"
          git push origin HEAD:fix/repair-quote-state-and-so-invoice-lineage
