name: Ops find sale orders (push trigger)

on:
  push:
    branches: [master]
    paths:
      - 'ops/find-sale-orders-request.json'

jobs:
  find-sale-orders:
    name: Find sale orders on Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request
        run: |
          set -euo pipefail
          COUNT=$(jq -r '(.queries // []) | length' ops/find-sale-orders-request.json)
          CUSTOMER=$(jq -r '.customer // empty' ops/find-sale-orders-request.json)
          ORDER=$(jq -r '.order // empty' ops/find-sale-orders-request.json)
          if [ "$COUNT" -lt 1 ] && [ -z "$CUSTOMER" ] && [ -z "$ORDER" ]; then
            echo "ERROR: queries[] / customer / order required" >&2
            exit 1
          fi

      - name: Copy script + request to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/find-sale-orders.mjs,ops/find-sale-orders-request.json
          target: /tmp/deed-ops/

      - name: Run find-sale-orders script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            SCRIPT=scripts/find-sale-orders.mjs
            REQUEST=ops/find-sale-orders-request.json
            mkdir -p scripts ops
            cp /tmp/deed-ops/scripts/find-sale-orders.mjs "$SCRIPT"
            cp /tmp/deed-ops/ops/find-sale-orders-request.json "$REQUEST"
            node "$SCRIPT" --request "$REQUEST"
            if git ls-files --error-unmatch "$SCRIPT" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$SCRIPT" 2>/dev/null || git checkout HEAD -- "$SCRIPT" || true
            else
              rm -f "$SCRIPT"
            fi
            if git ls-files --error-unmatch "$REQUEST" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$REQUEST" 2>/dev/null || git checkout HEAD -- "$REQUEST" || true
            else
              rm -f "$REQUEST"
            fi
