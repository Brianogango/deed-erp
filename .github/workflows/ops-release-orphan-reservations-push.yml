name: Ops release orphan reservations (push trigger)

on:
  push:
    branches: [master]
    paths:
      - 'ops/release-orphan-reservations-request.json'

jobs:
  release-orphan-reservations:
    name: Release orphan reservations on Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request
        run: |
          set -euo pipefail
          MODE=$(jq -r '.mode // "list"' ops/release-orphan-reservations-request.json)
          ORDER=$(jq -r '.order // empty' ops/release-orphan-reservations-request.json)
          CUSTOMER=$(jq -r '.customer // empty' ops/release-orphan-reservations-request.json)
          if [ -z "$ORDER" ] && [ -z "$CUSTOMER" ]; then
            echo "ERROR: order or customer required" >&2
            exit 1
          fi
          echo "mode=$MODE order=$ORDER customer=$CUSTOMER"

      - name: Copy script + request to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/release-orphan-reservations.mjs,ops/release-orphan-reservations-request.json
          target: /tmp/deed-ops/

      - name: Run release-orphan-reservations script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            SCRIPT=scripts/release-orphan-reservations.mjs
            REQUEST=ops/release-orphan-reservations-request.json
            mkdir -p scripts ops
            cp /tmp/deed-ops/scripts/release-orphan-reservations.mjs "$SCRIPT"
            cp /tmp/deed-ops/ops/release-orphan-reservations-request.json "$REQUEST"
            node "$SCRIPT" --request "$REQUEST"
            if git ls-files --error-unmatch "$SCRIPT" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$SCRIPT" 2>/dev/null || git checkout HEAD -- "$SCRIPT" || true
            else
              rm -f "$SCRIPT"
            fi
            if git ls-files --error-unmatch "$REQUEST" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$REQUEST" 2>/dev/null || git checkout HEAD -- "$REQUEST" || true
            else
              rm -f "$REQUEST"
            fi
