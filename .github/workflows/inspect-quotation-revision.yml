name: Inspect quotation revision controls
on:
  push:
    branches:
      - fix/quotation-revision-control
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect revision flow
        run: |
          echo '--- createNewSOVersion everywhere ---'
          grep -R -n -A100 -B25 "createNewSOVersion" --exclude-dir=node_modules . | head -n 900 || true
          echo '--- versionNumber everywhere ---'
          grep -R -n -A80 -B20 "versionNumber" app lib components --exclude='Sales.tsx' | head -n 900 || true
          echo '--- sale order version routes ---'
          find app/api/sale-orders -maxdepth 5 -type f -print | sort || true
          grep -R -n -A120 -B20 "versions" app/api/sale-orders lib --exclude-dir=node_modules | head -n 900 || true
