name: CI & Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Never run two deploys at once; queue pushes to master.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    env:
      # Next 15 + this repo's generated types exceed Node's ~2GB default heap
      # during `tsc --noEmit` (same cap already used by the e2e build).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run correctness gates before the dependency audit so known dependency
      # advisories do not hide TypeScript or unit-test regressions. The audit
      # remains a hard failure gate and therefore cannot be bypassed.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Dependency security audit
        run: pnpm audit --prod --audit-level high --ignore GHSA-jmr9-qjv8-65gv --ignore GHSA-7pqw-9j4j-h8q3

  e2e:
    name: E2E smoke + critical workflows
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deed_erp_ci
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/deed_erp_ci
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      E2E_USERNAME: e2edirector
      E2E_PASSWORD: ci-e2e-password-not-for-production
      E2E_RELAX_RATE_LIMIT: '1'
      # The production Next build currently exceeds Node's ~2GB default heap
      # while lint/type validation runs. Keep the build deterministic in CI.
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deed_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Prisma schema to CI database
        run: npx prisma db push --accept-data-loss

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke + critical workflow tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [quality, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Ops helpers copied into scripts/ can block deploy; scrub only those paths
      # (never .env / uploads / DB) before the deploy script's dirty check.
      - name: Clear known ops script copies on Contabo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            OPS_PATHS=(
              scripts/book-leave-for-employee.mjs
              scripts/add-product-serial.mjs
              scripts/heal-delivery-qty.mjs
              scripts/revert-hollow-done-delivery.mjs
              scripts/detect-hollow-done-deliveries.mjs
              scripts/purge-explore-test-data.mjs
              scripts/add-opening-bulk-stock.mjs
              scripts/heal-grn-serials.mjs
              scripts/mark-serials-sold.mjs
              scripts/find-serials.mjs
              scripts/find-repairs.mjs
              scripts/find-sale-orders.mjs
              scripts/delete-repairs.mjs
              scripts/restore-missing-repairs.mjs
              scripts/heal-restored-repair-assignments.mjs
              scripts/enrich-restored-repairs-from-backup.mjs
              scripts/diagnose-email.mjs
              scripts/release-orphan-reservations.mjs
              scripts/undo-sale-delivery.mjs
              scripts/set-mailbox-smtp.mjs
              scripts/test-mailbox-email.mjs
              ops/mark-serials-sold-request.json
              ops/find-serials-request.json
              ops/find-repairs-request.json
              ops/find-sale-orders-request.json
              ops/delete-repairs-request.json
              ops/restore-missing-repairs-request.json
              ops/heal-restored-repair-assignments-request.json
              ops/enrich-restored-repairs-request.json
              ops/heal-grn-serials-request.json
              ops/add-serial-request.json
              ops/add-opening-bulk-stock-request.json
              ops/purge-explore-test-request.json
              ops/heal-delivery-qty-request.json
              ops/revert-hollow-done-request.json
              ops/book-leave-request.json
              ops/diagnose-email-request.json
              ops/release-orphan-reservations-request.json
              ops/undo-sale-delivery-request.json
              ops/set-mailbox-smtp-request.json
              ops/test-mailbox-email-request.json
              ops/clean-worktree-request.json
            )
            for f in "${OPS_PATHS[@]}"; do
              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                git restore --source=HEAD --worktree --staged -- "$f" 2>/dev/null \
                  || git checkout HEAD -- "$f" 2>/dev/null \
                  || true
              elif [ -e "$f" ]; then
                echo "Removing untracked ops copy: $f"
                rm -f -- "$f"
              fi
            done
            # Mailbox SMTP ops leave timestamped .env backups; never touch live .env.
            rm -f -- .env.bak-mailbox-*
            # Stale previous-build dir is excluded from dirty checks but can confuse operators.
            rm -rf -- .next-staging
            # `next build` rewrites these tracked files; the installed
            # /usr/local/bin/deed-erp-deploy.sh dirty-check otherwise refuses
            # to pull after a successful swap.
            for generated_path in next-env.d.ts tsconfig.json; do
              if git ls-files --error-unmatch "$generated_path" >/dev/null 2>&1; then
                git restore --source=HEAD --worktree --staged -- "$generated_path" 2>/dev/null \
                  || git checkout HEAD -- "$generated_path" 2>/dev/null \
                  || true
              fi
            done
            git status --porcelain || true
            # Route GitHub git+ssh over 443 so Contabo outbound :22 quota
            # is not consumed by production `git fetch origin master`.
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            ssh_config="$HOME/.ssh/config"
            touch "$ssh_config"
            chmod 600 "$ssh_config"
            if ! grep -Fq 'HostName ssh.github.com' "$ssh_config"; then
              printf '\nHost github.com\n  HostName ssh.github.com\n  Port 443\n  User git\n' >>"$ssh_config"
              echo "Configured GitHub SSH over 443"
            fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: /usr/local/bin/deed-erp-deploy.sh

      # Idempotent: skips products that already exist by name.
      - name: Seed Final_b974 products
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            chmod +x scripts/apply-sql-as-postgres.sh
            # Table owner is postgres; app role cannot ALTER products.
            scripts/apply-sql-as-postgres.sh database/migrations/20260625_inventory_foundation_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260731_odoo_parity_phase1_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260731_odoo_parity_phase2_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260731_odoo_parity_phase4_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260828_ops_after_accounting_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260828_coa_alignment_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260828_official_coa_alignment_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260829_contact_payment_terms_default_zero_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260829_mpesa_stk_requests_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260830_user_mfa_security_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260830_user_session_version_safe.sql
            scripts/apply-sql-as-postgres.sh database/migrations/20260831_sms_conversations.sql
            node scripts/fix-coa-blob-alignment.mjs
            node scripts/zero-contact-payment-terms.mjs --apply
            node scripts/seed-products-final-b974.mjs

      - name: Verify production commit, MFA config, and host posture
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            LIVE_SHA="$(git rev-parse HEAD)"
            EXPECTED_SHA="${{ github.sha }}"
            echo "Production commit: $LIVE_SHA"
            echo "Expected commit:   $EXPECTED_SHA"
            test "$LIVE_SHA" = "$EXPECTED_SHA"
            node scripts/security/verify-production-config.mjs
            EXPECTED_COMMIT_SHA="$EXPECTED_SHA" bash scripts/security/audit-production-host.sh
            node scripts/security/live-penetration-smoke.mjs
