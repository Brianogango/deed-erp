name: Apply Repair stability phase 1
on:
  push:
    branches:
      - fix/repair-stability-phase1-stable
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-stability-phase1-stable
      - name: Apply stability patch
        run: python scripts/apply-repair-stability-phase1.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize Repair navigation and live state [skip ci]"
          git push origin HEAD:fix/repair-stability-phase1-stable
