name: Ops diagnose email (push trigger)

on:
  push:
    branches: [master]
    paths:
      - 'ops/diagnose-email-request.json'

jobs:
  diagnose-email:
    name: Diagnose email config on Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy script + request to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/diagnose-email.mjs,ops/diagnose-email-request.json
          target: /tmp/deed-ops/

      - name: Run diagnose-email script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            SCRIPT=scripts/diagnose-email.mjs
            REQUEST=ops/diagnose-email-request.json
            mkdir -p scripts ops
            cp /tmp/deed-ops/scripts/diagnose-email.mjs "$SCRIPT"
            cp /tmp/deed-ops/ops/diagnose-email-request.json "$REQUEST"
            node "$SCRIPT" --request "$REQUEST"
            if git ls-files --error-unmatch "$SCRIPT" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$SCRIPT" 2>/dev/null || git checkout HEAD -- "$SCRIPT" || true
            else
              rm -f "$SCRIPT"
            fi
            if git ls-files --error-unmatch "$REQUEST" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$REQUEST" 2>/dev/null || git checkout HEAD -- "$REQUEST" || true
            else
              rm -f "$REQUEST"
            fi
