name: PR 766 one-shot type fix

on:
  push:
    branches:
      - cursor/vendor-bill-confirm-404-4bcb

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/vendor-bill-confirm-404-4bcb
          fetch-depth: 0
      - name: Apply exact type-only corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stock = Path('lib/inventory/stock-transactions.ts')
          text = stock.read_text()
          old = "const poItem = poItemMatch ? po.items.find(item => item.id === poItemMatch.id) : undefined"
          new = "const poItem = po && poItemMatch ? po.items.find(item => item.id === poItemMatch.id) : undefined"
          if old not in text:
              raise SystemExit('expected stock-transactions target not found')
          stock.write_text(text.replace(old, new, 1))

          sync = Path('lib/purchase/po-prisma-sync.ts')
          text = sync.read_text()
          old = "const blobLines = po.lines.map((line: any) => ({"
          new = "const blobLines: Array<{ id: string; productId: string; description: string; qtyReceived: number }> = po.lines.map((line: any) => ({"
          if old not in text:
              raise SystemExit('expected po-prisma-sync target not found')
          sync.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/pr766-typefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): resolve PR 766 type errors"
          git push origin HEAD:cursor/vendor-bill-confirm-404-4bcb
