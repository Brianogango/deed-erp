name: Apply inventory location switcher
on:
  push:
    branches:
      - ux/inventory-location-switcher
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/inventory-location-switcher
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_inventory_location_switcher.py
      - name: Validate patch
        run: |
          git diff --check
          grep -n "useUrlUiState('location'\|Inventory stock location\|aria-selected\|activeWarehouseLocation" components/modules/Inventory.tsx | head -n 30
          if grep -n "operations-warehouse-layout\|operations-attention" components/modules/Inventory.tsx; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/Inventory.tsx scripts/apply_inventory_location_switcher.py .github/workflows/apply-inventory-location-switcher.yml
          git commit -m "Switch inventory warehouse locations with tabs"
          git push origin HEAD:ux/inventory-location-switcher
