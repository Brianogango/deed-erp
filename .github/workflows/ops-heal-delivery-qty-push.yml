name: Ops heal delivery qty (push trigger)

on:
  push:
    branches: [master]
    paths:
      - 'ops/heal-delivery-qty-request.json'

jobs:
  heal-delivery-qty:
    name: Heal delivery qty on Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # An ops request only runs when it is explicitly armed. Without this, any
      # commit that touches the request file — a merge, a revert, a rebase, a
      # conflict resolution — re-runs whatever payload the file happens to hold
      # against production. Arming is a deliberate edit: set "armed": true.
      - name: Guard — request must be armed
        id: guard
        run: |
          set -euo pipefail
          REQUEST=ops/heal-delivery-qty-request.json
          ARMED=$(jq -r '.armed // false' "$REQUEST")
          if [ "$ARMED" != "true" ]; then
            echo "::notice::$REQUEST is disarmed (armed != true) — nothing was run."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read request
        if: steps.guard.outputs.armed == 'true'
        id: req
        run: |
          set -euo pipefail
          ORDER=$(jq -r '.order // empty' ops/heal-delivery-qty-request.json)
          DELIVERY=$(jq -r '.delivery // empty' ops/heal-delivery-qty-request.json)
          if [ -z "$ORDER" ]; then
            echo "ERROR: order required in ops/heal-delivery-qty-request.json" >&2
            exit 1
          fi
          echo "order=$ORDER" >> "$GITHUB_OUTPUT"
          echo "delivery=$DELIVERY" >> "$GITHUB_OUTPUT"

      - name: Copy script to server
        if: steps.guard.outputs.armed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/heal-delivery-qty.mjs
          target: /tmp/deed-ops/
          strip_components: 1

      - name: Run heal-delivery-qty script
        if: steps.guard.outputs.armed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            # Copy into app tree so `pg` resolves from node_modules, then clean up.
            SCRIPT=scripts/heal-delivery-qty.mjs
            cp /tmp/deed-ops/heal-delivery-qty.mjs "$SCRIPT"
            if [ -n '${{ steps.req.outputs.delivery }}' ]; then
              node "$SCRIPT" \
                --order '${{ steps.req.outputs.order }}' \
                --delivery '${{ steps.req.outputs.delivery }}'
            else
              node "$SCRIPT" \
                --order '${{ steps.req.outputs.order }}'
            fi
            if git ls-files --error-unmatch "$SCRIPT" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$SCRIPT" 2>/dev/null || git checkout HEAD -- "$SCRIPT" || true
            else
              rm -f "$SCRIPT"
            fi
