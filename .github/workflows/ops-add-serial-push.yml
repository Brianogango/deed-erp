name: Ops add product serial (push trigger)

on:
  push:
    branches: [master]
    paths:
      - 'ops/add-serial-request.json'

jobs:
  add-serial:
    name: Add serial on Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read request
        id: req
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name // empty' ops/add-serial-request.json)
          SERIAL=$(jq -r '.serial // empty' ops/add-serial-request.json)
          LOCATION=$(jq -r '.location // "warehouse"' ops/add-serial-request.json)
          PRODUCT_ID=$(jq -r '.productId // empty' ops/add-serial-request.json)
          if [ -z "$NAME" ] && [ -z "$PRODUCT_ID" ]; then
            echo "ERROR: name or productId required in ops/add-serial-request.json" >&2
            exit 1
          fi
          if [ -z "$SERIAL" ]; then
            echo "ERROR: serial required in ops/add-serial-request.json" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "product_id=$PRODUCT_ID" >> "$GITHUB_OUTPUT"

      - name: Copy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/add-product-serial.mjs
          target: /tmp/deed-ops/
          strip_components: 1

      - name: Run add-product-serial script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /var/www/deed-erp
            # Run from the app tree so ESM can resolve `pg` from node_modules, then clean up.
            SCRIPT=scripts/add-product-serial.mjs
            cp /tmp/deed-ops/add-product-serial.mjs "$SCRIPT"
            if [ -n '${{ steps.req.outputs.product_id }}' ]; then
              node "$SCRIPT" \
                --product-id '${{ steps.req.outputs.product_id }}' \
                --serial '${{ steps.req.outputs.serial }}' \
                --location '${{ steps.req.outputs.location }}'
            else
              node "$SCRIPT" \
                --name '${{ steps.req.outputs.name }}' \
                --serial '${{ steps.req.outputs.serial }}' \
                --location '${{ steps.req.outputs.location }}'
            fi
            if git ls-files --error-unmatch "$SCRIPT" >/dev/null 2>&1; then
              git restore --source=HEAD --worktree --staged -- "$SCRIPT" 2>/dev/null || git checkout HEAD -- "$SCRIPT" || true
            else
              rm -f "$SCRIPT"
            fi
