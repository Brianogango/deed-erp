name: Apply repair requote fix
on:
  push:
    branches:
      - fix/repair-requote-renotify-salesperson-copy
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-requote-renotify-salesperson-copy
          fetch-depth: 0
      - name: Apply repair requote fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          store = Path('lib/store.tsx')
          s = store.read_text()

          old_sig = "generateRepairQuote: (repairId: string, lines: Omit<RepairQuoteLine, 'id' | 'reserved'>[], applyVat?: boolean) => void"
          new_sig = "generateRepairQuote: (repairId: string, lines: Omit<RepairQuoteLine, 'id' | 'reserved'>[], applyVat?: boolean) => Promise<RepairQuote | undefined>"
          if old_sig not in s:
              raise SystemExit('generateRepairQuote interface signature not found')
          s = s.replace(old_sig, new_sig, 1)

          # Replace the silent best-effort notification on customer-approval quotes
          # with an awaited, revision-specific send. A new quote.id is created for
          # every saved revision, so same-total revisions still notify exactly once.
          pattern = re.compile(r"""        if \(repair\.customerEmail \|\| repair\.customerPhone\) \{\n          const trackingUrl = typeof window !== 'undefined' \? `\$\{window\.location\.origin\}/portal/repair/\$\{encodeURIComponent\(repair\.ref\)\}` : undefined\n          fetch\('/api/notifications/send', \{\n            method: 'POST', headers: \{ 'Content-Type': 'application/json' \},\n            body: JSON\.stringify\(\{\n              type: 'quote',\n              customerName: repair\.customerName,\n              customerEmail: repair\.customerEmail,\n              customerPhone: repair\.customerPhone,\n              channels: repair\.customerEmail \? \['email'\] : undefined,\n              repairRef: repair\.ref,\n              deviceName: repair\.productName,\n              quoteTotal: quote\.total,\n              quoteUrl: trackingUrl,\n              changeSummary,\n            \}\),\n          \}\)\.catch\(\(\) => \{\}\)\n        \}\n        showToast\(\n          reopeningAfterDecline\n            \? 'Revised quote sent after decline — awaiting customer re-approval'\n            : isUpdate\n              \? 'Quote revised — customer re-notified, procurement requests reset'\n              : `Quote generated — customer notified via \$\{repair\.customerEmail \? 'email' : 'SMS'\}`,\n        \)""")
          replacement = """        let customerNotified = false
        if (repair.customerEmail || repair.customerPhone) {
          const trackingUrl = typeof window !== 'undefined'
            ? `${window.location.origin}/portal/repair/${encodeURIComponent(repair.ref)}`
            : undefined
          try {
            const notifyResponse = await fetch('/api/notifications/send', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'quote',
                repairRef: repair.ref,
                quoteTotal: quote.total,
                quoteUrl: trackingUrl,
                changeSummary,
                isRevision: isUpdate,
                idempotencyKey: `repair-quote:${repair.id}:${quote.id}`,
                channels: ['email', 'whatsapp', 'sms'],
              }),
            })
            const notifyResult = await notifyResponse.json().catch(() => null)
            customerNotified = Boolean(notifyResponse.ok && notifyResult?.success)
          } catch {
            customerNotified = false
          }
        }
        showToast(
          customerNotified
            ? reopeningAfterDecline
              ? 'Revised quote sent after decline — customer re-notified for approval'
              : isUpdate
                ? 'Quote updated — customer re-notified for approval'
                : 'Quote generated — customer notified for approval'
            : (repair.customerEmail || repair.customerPhone)
              ? (isUpdate ? 'Quote updated, but customer notification could not be confirmed' : 'Quote generated, but customer notification could not be confirmed')
              : (isUpdate ? 'Quote updated — no customer email or phone is available' : 'Quote generated — no customer email or phone is available'),
          customerNotified ? 'success' : 'info',
        )"""
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('repair quote notification block not found')

          end_marker = """      }
    },
    
    sendQuoteToCustomer: async (repairId) => {"""
          end_replacement = """      }
      return quote
    },
    
    sendQuoteToCustomer: async (repairId) => {"""
          if end_marker not in s:
              raise SystemExit('generateRepairQuote end marker not found')
          s = s.replace(end_marker, end_replacement, 1)
          store.write_text(s)

          modal = Path('components/modules/RepairModals.tsx')
          m = modal.read_text()
          old = re.compile(r"""      await Promise\.resolve\(generateRepairQuote\(repair\.id, lines as any, applyVat\)\)\n      if \(repair\.customerPhone\) \{.*?\n      \}\n      onClose\(\)""", re.S)
          new = """      const savedQuote = await Promise.resolve(generateRepairQuote(repair.id, lines as any, applyVat))
      // The store owns portal sync + customer notification so initial sends and
      // revisions follow one durable path and never double-notify.
      if (!savedQuote) return
      onClose()"""
          m, n = old.subn(new, m, count=1)
          if n != 1:
              raise SystemExit('QuoteModal duplicate notification block not found')
          modal.write_text(m)

          route = Path('app/api/notifications/send/route.ts')
          r = route.read_text()
          old_title = """      const title = type === 'quote'
        ? `Repair quotation ready — ${record.repair.jobNumber}`
        : `Repair update — ${record.repair.jobNumber}`
      const message = type === 'quote'
        ? `Your repair quotation is ready. Repair: ${record.repair.jobNumber}. Device: ${deviceName}. Total: KES ${quoteTotal.toLocaleString('en-KE')}.${params.quoteUrl ? ` View: ${params.quoteUrl}` : ''}`
        : String(params.message || 'There is an update on your repair.')"""
          new_title = """      const quoteRevision = type === 'quote' && Boolean(params.isRevision)
      const title = type === 'quote'
        ? `${quoteRevision ? 'Updated repair quotation' : 'Repair quotation ready'} — ${record.repair.jobNumber}`
        : `Repair update — ${record.repair.jobNumber}`
      const message = type === 'quote'
        ? `${quoteRevision ? 'Your repair quotation has been updated. Please review and approve the revised quote.' : 'Your repair quotation is ready.'} Repair: ${record.repair.jobNumber}. Device: ${deviceName}. Total: KES ${quoteTotal.toLocaleString('en-KE')}.${params.quoteUrl ? ` View: ${params.quoteUrl}` : ''}`
        : String(params.message || 'There is an update on your repair.')"""
          if old_title not in r:
              raise SystemExit('notification quote title/message block not found')
          r = r.replace(old_title, new_title, 1)
          route.write_text(r)

          # Remove inspection and this one-shot workflow from the resulting commit.
          Path('.github/workflows/inspect-repair-requote.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-repair-requote-fix.yml').unlink(missing_ok=True)

      - name: Commit repair requote fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/store.tsx components/modules/RepairModals.tsx app/api/notifications/send/route.ts .github/workflows/inspect-repair-requote.yml .github/workflows/apply-repair-requote-fix.yml
          git diff --cached --check
          git commit -m "Fix repair quote revision sync and re-notification"
          git push origin HEAD:fix/repair-requote-renotify-salesperson-copy
